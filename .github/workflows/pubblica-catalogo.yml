name: Aggiorna e pubblica MedFlight Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: medflighthub-update
  cancel-in-progress: false

jobs:
  aggiorna:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Leggi i file del progetto
        uses: actions/checkout@v4

      - name: Cerca le fonti ufficiali ANAC
        run: |
          python3 scopri_fonti_anac.py > fonti_anac.txt
          test -s fonti_anac.txt

      - name: Filtra le gare per MedFlight Hub
        shell: bash
        run: |
          mapfile -t FONTI < fonti_anac.txt
          python3 anac_importer.py "${FONTI[@]}" \
            --output anac_catalog.json

      - name: Salva il catalogo aggiornato
        run: |
          git config user.name "MedFlight Hub Cloud"
          git config user.email "actions@github.com"
          git add anac_catalog.json
          if ! git
